services:
  postgres:
    image: postgres:16-alpine
    container_name: trucommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trucommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trucommerce}
      POSTGRES_DB: ${POSTGRES_DB:-trucommerce}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trucommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trucommerce

  redis:
    image: redis:7-alpine
    container_name: trucommerce-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - trucommerce

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${APP_ENV:-development}
    container_name: trucommerce-backend
    restart: unless-stopped
    image: ntoric/vtchicken_backend:${APP_ENV:-dev}
    environment:
      # Application
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-trucommerce}
      PORT: ${PORT:-8080}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # PostgreSQL
      POSTGRES_DSN: postgres://${POSTGRES_USER:-trucommerce}:${POSTGRES_PASSWORD:-trucommerce}@postgres:5432/${POSTGRES_DB:-trucommerce}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-1h}
      DB_MAX_CONN_IDLE_TIME: ${DB_MAX_CONN_IDLE_TIME:-15m}
      # Redis
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      # JWT / Auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-admin@trucommerce.app}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-admin12345}
      # Single-store resolution: optionally pin the store to a specific tenant slug
      STORE_SLUG: ${STORE_SLUG:-}
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:13000}
      CORS_MAX_AGE: ${CORS_MAX_AGE:-12h}
      # HTTP Server
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-30s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-120s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}
      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      # Cookie / Session
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # File Uploads
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-10485760}
      UPLOAD_ALLOWED_TYPES: ${UPLOAD_ALLOWED_TYPES:-image/jpeg,image/png,image/webp,image/gif}
      # SMTP / Email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-TruCommerce}
      # Payment Gateways
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      ENABLE_TEST_PAYMENTS: ${ENABLE_TEST_PAYMENTS:-true}
      # Currency Cache
      CURRENCY_CACHE_TTL: ${CURRENCY_CACHE_TTL:-5m}
    ports:
      - "${BACKEND_HOST_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    networks:
      - trucommerce

  frontstore:
    build:
      context: ./frontstore
      dockerfile: Dockerfile
      target: ${APP_ENV:-development}
    container_name: trucommerce-frontstore
    image: ntoric/vtchicken_frontstore:${APP_ENV:-dev}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:13000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:13000}
      INTERNAL_API_BASE_URL: http://backend:8080
      INTERNAL_BACKOFFICE_URL: http://backoffice:5173
    ports:
      - "${FRONTSTORE_HOST_PORT:-13000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontstore:/app
      - /app/node_modules
      - /app/.next
    networks:
      - trucommerce
    profiles:
      - frontend

  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile
      target: ${APP_ENV:-development}
    container_name: trucommerce-backoffice
    image: ntoric/vtchicken_backoffice:${APP_ENV:-dev}
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backoffice:/app
      - /app/node_modules
    networks:
      - trucommerce
    profiles:
      - frontend

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${APP_ENV:-development}
    container_name: trucommerce-mcp
    image: ntoric/vtchicken_mcp:${APP_ENV:-dev}
    restart: unless-stopped
    command: ["sh", "-c", "go run ./cmd/mcp-server --transport sse --addr :9100"]
    environment:
      MCP_API_BASE_URL: http://backend:8080
      MCP_TRANSPORT: sse
      MCP_ADDR: ":9100"
      # Optional auto-login (leave empty to require per-session login via tools)
      MCP_AUTH_EMAIL: ${MCP_AUTH_EMAIL:-}
      MCP_AUTH_PASSWORD: ${MCP_AUTH_PASSWORD:-}
      # Set to "true" to auto-login as platform superadmin instead of a store user
      MCP_AUTH_PLATFORM: ${MCP_AUTH_PLATFORM:-}
    ports:
      - "${MCP_HOST_PORT:-9100}:9100"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - trucommerce
    profiles:
      - mcp

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  trucommerce:
    driver: bridge
